<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Flotilla</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='88'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel2: #1a2233; --line: #243049;
    --txt: #e6edf7; --dim: #8b9bb4; --accent: #4f8cff;
    --working: #4ad991; --waiting: #ffb454; --idle: #6b7a92; --exited: #455067;
    --ok: #4ad991; --danger: #ff5d6c;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --radius-sm: 6px; --radius-md: 10px; --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: var(--bg); color: var(--txt);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: var(--space-3);
    padding: calc(var(--space-2) + env(safe-area-inset-top)) calc(var(--space-4) + env(safe-area-inset-right)) var(--space-2) calc(var(--space-4) + env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: 13px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease, opacity .15s ease; }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; font-weight: 600; }
  select, input { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--space-2) var(--space-2); font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  #fleet { width: 340px; max-width: 42vw; overflow-y: auto; border-right: 1px solid var(--line);
    background: var(--panel); padding: var(--space-2);
    scrollbar-width: thin; scrollbar-color: var(--line) var(--panel); }
  #fleet::-webkit-scrollbar { width: 10px; }
  #fleet::-webkit-scrollbar-track { background: var(--panel); }
  #fleet::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--radius-pill); }
  #fleet::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  .host { margin-bottom: var(--space-3); }
  .host h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    margin: var(--space-2) var(--space-2) var(--space-1); display: flex; align-items: center; gap: var(--space-2); }
  .host h2 .meta { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .host h2 .meta.alert { color: var(--danger); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--idle);
    transition: background .2s ease; }
  .dot.ok { background: var(--ok); } .dot.down { background: var(--danger); }
  .sess { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent;
    border-left: 3px solid transparent;
    transition: background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
  .sess:hover { background: var(--panel2); box-shadow: 0 1px 8px rgba(0,0,0,.35); transform: translateX(2px); }
  .sess.active { background: var(--panel2); border-color: var(--accent); }
  .sess.working { border-left-color: var(--working); }
  .sess.waiting { border-left-color: var(--waiting); }
  .sess.idle { border-left-color: var(--idle); }
  .sess.exited { border-left-color: var(--exited); opacity: .55; }
  .sess .badge { font-size: 10px; padding: 2px 7px; border-radius: var(--radius-pill); text-transform: uppercase;
    letter-spacing: .5px; color: #04101f; font-weight: 700; }
  .badge.working { background: var(--working); } .badge.waiting { background: var(--waiting); }
  .badge.idle { background: var(--idle); color: var(--txt); } .badge.exited { background: var(--exited); color: var(--dim); }
  .sess .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .nm small { color: var(--dim); }
  .tag { font-size: 9px; padding: 1px 6px; border-radius: var(--radius-pill); background: var(--line); color: var(--dim); margin-left: 4px; white-space: nowrap; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #termbar { display: flex; gap: var(--space-2); align-items: center;
    padding: var(--space-2) calc(var(--space-3) + env(safe-area-inset-right)) var(--space-2) calc(var(--space-3) + env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #termbar .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--idle);
    flex-shrink: 0; transition: background .2s ease; }
  .conn-dot.connecting { background: var(--waiting); }
  .conn-dot.live { background: var(--working); }
  .conn-dot.lost { background: var(--danger); }
  #term { flex: 1; min-height: 0; padding: var(--space-1); }
  #promptbar { display: flex; gap: var(--space-2);
    padding: var(--space-2) calc(var(--space-3) + env(safe-area-inset-right)) calc(var(--space-2) + env(safe-area-inset-bottom)) calc(var(--space-3) + env(safe-area-inset-left));
    background: var(--panel); border-top: 1px solid var(--line); }
  #promptbar input { flex: 1; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim);
    flex-direction: column; gap: var(--space-2); text-align: center; padding: 20px; }
  dialog { background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 18px; min-width: 300px; }
  dialog[open] { animation: dlgIn .15s ease; }
  dialog::backdrop { background: rgba(0,0,0,.6); animation: backdropIn .15s ease; }
  @keyframes dlgIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  dialog h3 { margin: 0 0 var(--space-3); }
  dialog .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-3); }
  dialog label { font-size: 12px; color: var(--dim); }
  dialog .actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  .hint { color: var(--dim); font-size: 12px; }
  #status { background: var(--panel2); border: 1px solid var(--line); padding: 4px 10px;
    border-radius: var(--radius-pill); font-size: 11px; white-space: nowrap; }
  #toasts { position: fixed; right: calc(var(--space-3) + env(safe-area-inset-right));
    bottom: calc(var(--space-3) + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
    gap: var(--space-2); z-index: 50; max-width: 320px; }
  .toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-left-color: var(--danger); }
  .toast.success { border-left-color: var(--working); }
  #fleetBackdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 4;
    opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  #menuBtn { display: none; }
  @media (max-width: 720px) {
    #fleet { position: absolute; z-index: 5; height: calc(100% - 49px); width: 86%; max-width: 86%;
      transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.6); }
    #fleet.open { transform: translateX(0); }
    #menuBtn { display: inline-flex; }
    #fleetBackdrop.show { display: block; opacity: 1; pointer-events: auto; }
    button.iconbtn, #menuBtn, #refreshBtn { min-width: 44px; min-height: 44px; }
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="iconbtn" title="Toggle host list" aria-label="Toggle host list">☰</button>
  <h1>⚓ FLOTILLA</h1>
  <span id="status"></span>
  <span class="spacer"></span>
  <input id="filter" placeholder="filter name/tag…" style="max-width:170px" aria-label="Filter sessions by name or tag" />
  <button id="newBtn">+ Session</button>
  <button id="hostsBtn">Hosts</button>
  <button id="refreshBtn" class="iconbtn" title="Refresh" aria-label="Refresh">↻</button>
</header>
<main>
  <aside id="fleet"></aside>
  <section id="stage">
    <div id="empty">
      <div style="font-size:32px">⚓</div>
      <div>Select a session to attach, or add a host.</div>
      <div class="hint">Your phone reaches every box over the Tailscale tailnet.</div>
      <button id="emptyAddHostBtn" class="primary">+ Add a host</button>
    </div>
    <div id="termbar" style="display:none">
      <span class="conn-dot" id="connDot" title="Connection status"></span>
      <span class="hint" id="connLabel"></span>
      <button id="reconnectBtn" style="display:none">Reconnect</button>
      <span class="title" id="termTitle"></span>
      <button id="killBtn">Kill</button>
      <button id="detachBtn">Detach</button>
    </div>
    <div id="term" style="display:none"></div>
    <div id="promptbar" style="display:none">
      <input id="promptInput" placeholder="Send a prompt + Enter (fire-and-forget, great for phones)…" />
      <button class="primary" id="sendBtn">Send</button>
    </div>
  </section>
</main>

<dialog id="newDlg">
  <h3>New session</h3>
  <div class="row"><label>Host</label><select id="newHost"></select></div>
  <div class="row"><label>Profile</label><select id="newProfile"></select></div>
  <div class="row"><label>Name (optional)</label><input id="newName" placeholder="auto" /></div>
  <div class="row"><label>Tags (comma-separated, optional)</label><input id="newTags" placeholder="e.g. portal, urgent" /></div>
  <div class="actions"><button onclick="newDlg.close()">Cancel</button><button class="primary" id="createBtn">Create</button></div>
</dialog>

<dialog id="hostsDlg">
  <h3>Hosts (tailnet endpoints)</h3>
  <div id="hostList"></div>
  <div class="row"><label>Label</label><input id="hLabel" placeholder="work-server" /></div>
  <div class="row"><label>URL</label><input id="hUrl" placeholder="http://work-server.tailnet:7878" /></div>
  <div class="row"><label>Token (optional)</label><input id="hToken" placeholder="" /></div>
  <div class="actions"><button onclick="hostsDlg.close()">Close</button><button class="primary" id="addHostBtn">Add host</button></div>
</dialog>

<dialog id="confirmDlg">
  <h3 id="confirmTitle">Confirm</h3>
  <div id="confirmMsg" class="hint" style="margin-bottom:12px"></div>
  <div class="actions"><button id="confirmCancel">Cancel</button><button class="primary" id="confirmOk">Confirm</button></div>
</dialog>

<div id="toasts"></div>
<div id="fleetBackdrop"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
const LS_KEY = "flotilla.hosts";

// Seed with the origin this page was served from, so it "just works" on an agent.
function loadHosts() {
  let hosts = [];
  try { hosts = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch {}
  if (hosts.length === 0 && location.protocol.startsWith("http")) {
    hosts = [{ label: "this host", url: location.origin, token: "" }];
    saveHosts(hosts);
  }
  return hosts;
}
function saveHosts(h) { localStorage.setItem(LS_KEY, JSON.stringify(h)); }

function authHeaders(host) { return host.token ? { "Authorization": "Bearer " + host.token } : {}; }
async function api(host, path, opts = {}) {
  const r = await fetch(host.url + path, { ...opts, headers: { ...(opts.headers||{}), ...authHeaders(host) } });
  if (!r.ok && r.status !== 204) throw new Error(host.label + " " + path + " → " + r.status);
  return r.status === 204 ? null : (r.headers.get("content-type")||"").includes("json") ? r.json() : r.text();
}

let hosts = loadHosts();
let active = null; // {host, session}
let pendingOpen = new URLSearchParams(location.search).get("open"); // deep link from notification
let ws = null, term = null, fit = null;
let fleetCache = []; // parallel to `hosts`: { ok, meta, sessions, err } — for client-side filtering w/o refetch

// ---- ws lifecycle guards ----
let attachGen = 0;      // bumped on every attach()/detach so stale ws/timer handlers become no-ops
let wsGen = 0;           // gen the *current* ws belongs to
let intentionalClose = false;
let reconnectAttempts = 0;
let reconnectTimer = null;

const $ = (id) => document.getElementById(id);

// ---- toast + confirm helpers (replace blocking alert()/confirm()) ----
function toast(msg, kind = "info", ms = 4000) {
  const container = $("toasts");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, ms);
}

function confirmDialog(message, okLabel = "Confirm") {
  return new Promise((resolve) => {
    $("confirmMsg").textContent = message;
    $("confirmOk").textContent = okLabel;
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    function cleanup() {
      confirmDlg.close();
      $("confirmOk").removeEventListener("click", onOk);
      $("confirmCancel").removeEventListener("click", onCancel);
      confirmDlg.removeEventListener("cancel", onCancel);
    }
    $("confirmOk").addEventListener("click", onOk);
    $("confirmCancel").addEventListener("click", onCancel);
    confirmDlg.addEventListener("cancel", onCancel);
    confirmDlg.showModal();
  });
}

// ---- fleet fetch/render ----
async function refresh() {
  const results = await Promise.all(hosts.map(async (host) => {
    try {
      const health = await api(host, "/api/health");
      const sessions = await api(host, "/api/sessions");
      return { ok: true, meta: `${health.os}/${health.arch}`, sessions };
    } catch (e) {
      return { ok: false, err: "unreachable", sessions: [] };
    }
  }));
  fleetCache = results;
  renderFleet();

  // Deep link from a notification tap: ?open=<session-id> → auto-attach.
  if (pendingOpen) {
    for (let i = 0; i < hosts.length; i++) {
      const hit = (results[i].sessions || []).find(s => s.id === pendingOpen);
      if (hit) { pendingOpen = null; attach(hosts[i], hit); break; }
    }
  }
}

// Re-render from the cached fleet (no network) — used for client-side filtering.
function renderFleet() {
  const fleet = $("fleet");
  fleet.innerHTML = "";
  let total = 0;
  hosts.forEach((host, i) => {
    const r = fleetCache[i] || { ok: false, sessions: [] };
    const div = document.createElement("div");
    div.className = "host";
    const h2 = document.createElement("h2");
    const dot = document.createElement("span"); dot.className = "dot" + (r.ok ? " ok" : " down");
    h2.appendChild(dot);
    const label = document.createElement("span"); label.textContent = host.label;
    h2.appendChild(label);
    const meta = document.createElement("span"); meta.className = "meta" + (r.ok ? "" : " alert");
    meta.textContent = r.ok ? r.meta : "unreachable";
    h2.appendChild(meta);
    div.appendChild(h2);
    fleet.appendChild(div);

    const sessions = r.sessions || [];
    total += sessions.length;
    if (r.ok && sessions.length === 0) {
      const e = document.createElement("div"); e.className = "hint"; e.style.padding = "0 10px 6px";
      e.textContent = "no sessions"; div.appendChild(e);
    }
    sessions.filter(matchesFilter).forEach(s => div.appendChild(sessionRow(host, s)));
  });
  $("status").textContent = `${hosts.length} host(s) · ${total} session(s)`;
}

function sessionRow(host, s) {
  const row = document.createElement("div");
  row.className = "sess " + s.state;
  if (active && active.host.url === host.url && active.session.id === s.id) row.classList.add("active");
  const badge = document.createElement("span");
  badge.className = "badge " + s.state;
  badge.textContent = s.state;
  row.appendChild(badge);
  const nm = document.createElement("span"); nm.className = "nm";
  nm.innerHTML = `${escapeHtml(s.name)} <small>${escapeHtml(s.profile)}</small>`;
  row.appendChild(nm);
  (s.tags || []).forEach(t => {
    const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = t;
    row.appendChild(tg);
  });
  row.onclick = () => attach(host, s);
  return row;
}

function matchesFilter(s) {
  const f = ($("filter").value || "").trim().toLowerCase();
  if (!f) return true;
  return (s.name || "").toLowerCase().includes(f)
    || (s.profile || "").toLowerCase().includes(f)
    || (s.tags || []).some(t => t.toLowerCase().includes(f));
}

function escapeHtml(s) { return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

// ---- drawer (mobile) ----
function closeDrawer() { $("fleet").classList.remove("open"); $("fleetBackdrop").classList.remove("show"); }
function toggleDrawer() { $("fleet").classList.toggle("open"); $("fleetBackdrop").classList.toggle("show"); }

// ---- connection state ----
function setConnState(state) {
  const dot = $("connDot"), label = $("connLabel"), btn = $("reconnectBtn");
  dot.className = "conn-dot " + state;
  label.textContent = ({ connecting: "Connecting…", live: "Live", lost: "Disconnected" })[state] || "";
  btn.style.display = state === "lost" ? "inline-block" : "none";
}

function clearReconnectTimer() { if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; } }
function closeSocket() { if (ws) { try { ws.close(); } catch {} } ws = null; }

function scheduleReconnect(myGen) {
  if (myGen !== attachGen || !active) return;
  setConnState("lost");
  if (reconnectAttempts >= 5) return; // exhausted auto-retry; user can still hit "Reconnect"
  const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 15000); // 1s,2s,4s,8s,~15s
  reconnectAttempts++;
  clearReconnectTimer();
  reconnectTimer = setTimeout(() => {
    if (myGen !== attachGen) return;
    connectWs();
  }, delay);
}

function connectWs() {
  if (!active) return;
  const { host, session } = active;
  const myGen = attachGen;
  wsGen = myGen;
  setConnState("connecting");

  const wsUrl = host.url.replace(/^http/, "ws") + `/api/sessions/${session.id}/attach` + (host.token ? `?token=${encodeURIComponent(host.token)}` : "");
  let socket;
  try {
    socket = new WebSocket(wsUrl);
  } catch (e) {
    scheduleReconnect(myGen);
    return;
  }
  socket.binaryType = "arraybuffer";
  ws = socket;

  socket.onopen = () => {
    if (myGen !== attachGen) return;
    reconnectAttempts = 0;
    setConnState("live");
    sendResize();
  };
  socket.onmessage = (ev) => {
    if (myGen !== attachGen || !term) return;
    if (typeof ev.data === "string") term.write(ev.data);
    else term.write(new Uint8Array(ev.data));
  };
  socket.onerror = () => {
    if (myGen !== attachGen) return;
    setConnState("lost");
  };
  socket.onclose = () => {
    if (myGen !== attachGen) return;
    if (ws === socket) ws = null;
    if (term) term.write("\r\n\x1b[90m[flotilla: disconnected]\x1b[0m\r\n");
    if (intentionalClose) return;
    scheduleReconnect(myGen);
  };
}

function sendResize() {
  if (wsGen !== attachGen) return;
  if (!ws || ws.readyState !== 1 || !term) return;
  ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
}

function attach(host, s) {
  // Invalidate any handlers/timers tied to a previous session before tearing it down.
  attachGen++;
  intentionalClose = false;
  reconnectAttempts = 0;
  clearReconnectTimer();
  closeSocket();
  if (term) { term.dispose(); term = null; }
  $("term").innerHTML = "";

  active = { host, session: s };
  $("empty").style.display = "none";
  $("termbar").style.display = "flex";
  $("term").style.display = "block";
  $("promptbar").style.display = "flex";
  $("termTitle").textContent = `${host.label} · ${s.name} (${s.profile})`;
  closeDrawer();

  const myGen = attachGen;
  term = new Terminal({ cursorBlink: true, fontSize: 13, fontFamily: "ui-monospace, Menlo, Consolas, monospace",
    theme: { background: "#0b0f17", foreground: "#e6edf7", cursor: "#4f8cff", cursorAccent: "#0b0f17" }, scrollback: 5000 });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("term"));
  fit.fit();
  term.onData((d) => { if (myGen !== attachGen) return; if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  term.onResize(() => { if (myGen !== attachGen) return; sendResize(); });

  connectWs();
  refresh();
}

function detach() {
  closeSocket();
  if (term) { term.dispose(); term = null; }
  $("term").innerHTML = "";
}

window.addEventListener("resize", () => { if (fit) try { fit.fit(); } catch {} });
// iOS Safari doesn't reliably fire window 'resize' when the soft keyboard opens/closes.
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    if (fit) try { fit.fit(); } catch {}
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) {
      setTimeout(() => { try { ae.scrollIntoView({ block: "center", behavior: "smooth" }); } catch {} }, 50);
    }
  });
}

// ---- controls ----
$("refreshBtn").onclick = refresh;
$("filter").addEventListener("input", renderFleet); // client-side only, no network round-trip
$("reconnectBtn").onclick = () => {
  if (!active) return;
  clearReconnectTimer();
  reconnectAttempts = 0;
  connectWs();
};
$("detachBtn").onclick = () => {
  intentionalClose = true;
  attachGen++; // invalidate any in-flight reconnect/handlers for the session we're leaving
  clearReconnectTimer();
  detach();
  active = null;
  $("termbar").style.display = "none"; $("term").style.display = "none";
  $("promptbar").style.display = "none"; $("empty").style.display = "flex";
  refresh();
};
$("killBtn").onclick = async () => {
  if (!active) return;
  const ok = await confirmDialog(`Kill session "${active.session.name}"? This cannot be undone.`, "Kill");
  if (!ok) return;
  try {
    await api(active.host, "/api/sessions/" + active.session.id, { method: "DELETE" });
    toast("Session killed.", "success");
    $("detachBtn").click();
  } catch (e) {
    toast("Kill failed: " + e.message, "error");
  }
};
$("sendBtn").onclick = sendPrompt;
$("promptInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendPrompt(); });
async function sendPrompt() {
  if (!active) return;
  const v = $("promptInput").value;
  if (!v) return;
  try {
    await api(active.host, "/api/sessions/" + active.session.id + "/input", { method: "POST", body: v });
    $("promptInput").value = "";
  } catch (e) {
    toast("Send failed: " + e.message, "error");
  }
}

$("menuBtn").onclick = toggleDrawer;
$("fleetBackdrop").onclick = closeDrawer;
$("emptyAddHostBtn").onclick = () => { renderHostList(); hostsDlg.showModal(); };

// New session dialog
$("newBtn").onclick = async () => {
  const hostSel = $("newHost"); hostSel.innerHTML = "";
  hosts.forEach((h, i) => { const o = document.createElement("option"); o.value = i; o.textContent = h.label; hostSel.appendChild(o); });
  await populateProfiles();
  hostSel.onchange = populateProfiles;
  newDlg.showModal();
};
async function populateProfiles() {
  const host = hosts[$("newHost").value || 0];
  const sel = $("newProfile"); sel.innerHTML = "";
  try {
    const profs = await api(host, "/api/profiles");
    profs.forEach(p => { const o = document.createElement("option"); o.value = p.name;
      o.textContent = p.name + (p.description ? " — " + p.description : ""); sel.appendChild(o); });
  } catch { const o = document.createElement("option"); o.textContent = "(host unreachable)"; sel.appendChild(o); }
}
$("createBtn").onclick = async () => {
  const host = hosts[$("newHost").value || 0];
  const profile = $("newProfile").value;
  const name = $("newName").value || undefined;
  const tags = ($("newTags").value || "").split(",").map(t => t.trim()).filter(Boolean);
  try {
    const s = await api(host, "/api/sessions", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile, name, tags }) });
    newDlg.close(); $("newName").value = ""; $("newTags").value = "";
    await refresh();
    attach(host, s);
  } catch (e) { toast("Create failed: " + e.message, "error"); }
};

// Hosts dialog
$("hostsBtn").onclick = () => { renderHostList(); hostsDlg.showModal(); };
function renderHostList() {
  const el = $("hostList"); el.innerHTML = "";
  hosts.forEach((h, i) => {
    const row = document.createElement("div"); row.className = "sess";
    row.innerHTML = `<span class="nm">${escapeHtml(h.label)} <small>${escapeHtml(h.url)}</small></span>`;
    const test = document.createElement("button"); test.className = "iconbtn"; test.textContent = "🔔";
    test.title = "Send a test notification from this host"; test.setAttribute("aria-label", "Send test notification from " + h.label);
    test.onclick = async () => {
      try { await api(h, "/api/notify-test", { method: "POST" }); toast("Test push sent from " + h.label + ".", "success"); }
      catch (e) { toast("Notify test failed (" + h.label + "): " + e.message, "error"); }
    };
    const del = document.createElement("button"); del.className = "iconbtn"; del.textContent = "✕";
    del.title = "Remove host"; del.setAttribute("aria-label", "Remove host " + h.label);
    del.onclick = () => { hosts.splice(i, 1); saveHosts(hosts); renderHostList(); refresh(); };
    row.appendChild(test); row.appendChild(del); el.appendChild(row);
  });
}
$("addHostBtn").onclick = () => {
  const label = $("hLabel").value.trim(), url = $("hUrl").value.trim().replace(/\/$/, ""), token = $("hToken").value.trim();
  if (!label || !url) { toast("Label and URL required.", "error"); return; }
  hosts.push({ label, url, token }); saveHosts(hosts);
  $("hLabel").value = $("hUrl").value = $("hToken").value = "";
  renderHostList(); refresh();
};

refresh();
setInterval(() => { if (!active) refresh(); }, 5000); // auto-refresh fleet when not attached
</script>
</body>
</html>
