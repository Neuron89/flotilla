<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Flotilla</title>
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel2: #1a2233; --line: #243049;
    --txt: #e6edf7; --dim: #8b9bb4; --accent: #4f8cff;
    --working: #ffb454; --waiting: #ff5d6c; --idle: #6b7a92; --exited: #455067; --ok: #4ad991;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; font-weight: 600; }
  select, input { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  #fleet { width: 340px; max-width: 42vw; overflow-y: auto; border-right: 1px solid var(--line);
    background: var(--panel); padding: 8px; }
  .host { margin-bottom: 12px; }
  .host h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    margin: 6px 6px 4px; display: flex; align-items: center; gap: 8px; }
  .host h2 .meta { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.down { background: var(--waiting); }
  .sess { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent; }
  .sess:hover { background: var(--panel2); }
  .sess.active { background: var(--panel2); border-color: var(--accent); }
  .sess .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; text-transform: uppercase;
    letter-spacing: .5px; color: #04101f; font-weight: 700; }
  .badge.working { background: var(--working); } .badge.waiting { background: var(--waiting); }
  .badge.idle { background: var(--idle); } .badge.exited { background: var(--exited); color: var(--dim); }
  .sess .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .nm small { color: var(--dim); }
  .tag { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--dim); margin-left: 4px; white-space: nowrap; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #000; }
  #termbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  #termbar .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #term { flex: 1; min-height: 0; padding: 6px; }
  #promptbar { display: flex; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #promptbar input { flex: 1; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim);
    flex-direction: column; gap: 8px; text-align: center; padding: 20px; }
  dialog { background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; min-width: 300px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 12px; }
  dialog .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  dialog label { font-size: 12px; color: var(--dim); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 720px) {
    #fleet { position: absolute; z-index: 5; height: calc(100% - 49px); width: 86%; max-width: 86%;
      transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.6); }
    #fleet.open { transform: translateX(0); }
    #menuBtn { display: inline-flex; }
  }
  #menuBtn { display: none; }
</style>
</head>
<body>
<header>
  <button id="menuBtn">☰</button>
  <h1>⚓ FLOTILLA</h1>
  <span class="hint" id="status"></span>
  <span class="spacer"></span>
  <input id="filter" placeholder="filter name/tag…" style="max-width:170px" />
  <button id="newBtn">+ Session</button>
  <button id="hostsBtn">Hosts</button>
  <button id="refreshBtn">↻</button>
</header>
<main>
  <aside id="fleet"></aside>
  <section id="stage">
    <div id="empty">
      <div style="font-size:32px">⚓</div>
      <div>Select a session to attach, or add a host.</div>
      <div class="hint">Your phone reaches every box over the Tailscale tailnet.</div>
    </div>
    <div id="termbar" style="display:none">
      <span class="title" id="termTitle"></span>
      <button id="killBtn">Kill</button>
      <button id="detachBtn">Detach</button>
    </div>
    <div id="term" style="display:none"></div>
    <div id="promptbar" style="display:none">
      <input id="promptInput" placeholder="Send a prompt + Enter (fire-and-forget, great for phones)…" />
      <button class="primary" id="sendBtn">Send</button>
    </div>
  </section>
</main>

<dialog id="newDlg">
  <h3>New session</h3>
  <div class="row"><label>Host</label><select id="newHost"></select></div>
  <div class="row"><label>Profile</label><select id="newProfile"></select></div>
  <div class="row"><label>Name (optional)</label><input id="newName" placeholder="auto" /></div>
  <div class="row"><label>Tags (comma-separated, optional)</label><input id="newTags" placeholder="e.g. portal, urgent" /></div>
  <div class="actions"><button onclick="newDlg.close()">Cancel</button><button class="primary" id="createBtn">Create</button></div>
</dialog>

<dialog id="hostsDlg">
  <h3>Hosts (tailnet endpoints)</h3>
  <div id="hostList"></div>
  <div class="row"><label>Label</label><input id="hLabel" placeholder="work-server" /></div>
  <div class="row"><label>URL</label><input id="hUrl" placeholder="http://work-server.tailnet:7878" /></div>
  <div class="row"><label>Token (optional)</label><input id="hToken" placeholder="" /></div>
  <div class="actions"><button onclick="hostsDlg.close()">Close</button><button class="primary" id="addHostBtn">Add host</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
const LS_KEY = "flotilla.hosts";

// Seed with the origin this page was served from, so it "just works" on an agent.
function loadHosts() {
  let hosts = [];
  try { hosts = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch {}
  if (hosts.length === 0 && location.protocol.startsWith("http")) {
    hosts = [{ label: "this host", url: location.origin, token: "" }];
    saveHosts(hosts);
  }
  return hosts;
}
function saveHosts(h) { localStorage.setItem(LS_KEY, JSON.stringify(h)); }

function authHeaders(host) { return host.token ? { "Authorization": "Bearer " + host.token } : {}; }
async function api(host, path, opts = {}) {
  const r = await fetch(host.url + path, { ...opts, headers: { ...(opts.headers||{}), ...authHeaders(host) } });
  if (!r.ok && r.status !== 204) throw new Error(host.label + " " + path + " → " + r.status);
  return r.status === 204 ? null : (r.headers.get("content-type")||"").includes("json") ? r.json() : r.text();
}

let hosts = loadHosts();
let active = null; // {host, session}
let pendingOpen = new URLSearchParams(location.search).get("open"); // deep link from notification
let ws = null, term = null, fit = null;

const $ = (id) => document.getElementById(id);

async function refresh() {
  const fleet = $("fleet");
  fleet.innerHTML = "";
  let total = 0;
  const found = [];
  for (const host of hosts) {
    const div = document.createElement("div");
    div.className = "host";
    const h2 = document.createElement("h2");
    const dot = document.createElement("span"); dot.className = "dot";
    h2.appendChild(dot);
    const label = document.createElement("span"); label.textContent = host.label;
    h2.appendChild(label);
    const meta = document.createElement("span"); meta.className = "meta";
    h2.appendChild(meta);
    div.appendChild(h2);
    fleet.appendChild(div);

    try {
      const health = await api(host, "/api/health");
      dot.classList.add("ok");
      meta.textContent = `${health.os}/${health.arch}`;
      const sessions = await api(host, "/api/sessions");
      total += sessions.length;
      for (const s of sessions) found.push({ host, s });
      const vis = sessions.filter(matchesFilter);
      if (sessions.length === 0) {
        const e = document.createElement("div"); e.className = "hint"; e.style.padding = "0 10px 6px";
        e.textContent = "no sessions"; div.appendChild(e);
      }
      for (const s of vis) div.appendChild(sessionRow(host, s));
    } catch (e) {
      dot.classList.add("down");
      meta.textContent = "unreachable";
    }
  }
  $("status").textContent = `${hosts.length} host(s) · ${total} session(s)`;

  // Deep link from a notification tap: ?open=<session-id> → auto-attach.
  if (pendingOpen) {
    const hit = found.find(r => r.s.id === pendingOpen);
    if (hit) { pendingOpen = null; attach(hit.host, hit.s); }
  }
}

function sessionRow(host, s) {
  const row = document.createElement("div");
  row.className = "sess";
  if (active && active.host.url === host.url && active.session.id === s.id) row.classList.add("active");
  const badge = document.createElement("span");
  badge.className = "badge " + s.state;
  badge.textContent = s.state;
  row.appendChild(badge);
  const nm = document.createElement("span"); nm.className = "nm";
  nm.innerHTML = `${escapeHtml(s.name)} <small>${escapeHtml(s.profile)}</small>`;
  row.appendChild(nm);
  (s.tags || []).forEach(t => {
    const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = t;
    row.appendChild(tg);
  });
  row.onclick = () => attach(host, s);
  return row;
}

function matchesFilter(s) {
  const f = ($("filter").value || "").trim().toLowerCase();
  if (!f) return true;
  return (s.name || "").toLowerCase().includes(f)
    || (s.profile || "").toLowerCase().includes(f)
    || (s.tags || []).some(t => t.toLowerCase().includes(f));
}

function escapeHtml(s) { return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function attach(host, s) {
  detach();
  active = { host, session: s };
  $("empty").style.display = "none";
  $("termbar").style.display = "flex";
  $("term").style.display = "block";
  $("promptbar").style.display = "flex";
  $("termTitle").textContent = `${host.label} · ${s.name} (${s.profile})`;
  $("fleet").classList.remove("open");

  term = new Terminal({ cursorBlink: true, fontSize: 13, fontFamily: "ui-monospace, Menlo, Consolas, monospace",
    theme: { background: "#000000" }, scrollback: 5000 });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("term"));
  fit.fit();

  const wsUrl = host.url.replace(/^http/, "ws") + `/api/sessions/${s.id}/attach` + (host.token ? `?token=${encodeURIComponent(host.token)}` : "");
  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => sendResize();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") term.write(ev.data);
    else term.write(new Uint8Array(ev.data));
  };
  ws.onclose = () => term && term.write("\r\n\x1b[90m[flotilla: disconnected]\x1b[0m\r\n");
  term.onData((d) => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  term.onResize(() => sendResize());
  refresh();
}

function sendResize() {
  if (!ws || ws.readyState !== 1 || !term) return;
  ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
}

function detach() {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  if (term) { term.dispose(); term = null; }
  $("term").innerHTML = "";
}

window.addEventListener("resize", () => { if (fit) try { fit.fit(); } catch {} });

// ---- controls ----
$("refreshBtn").onclick = refresh;
$("filter").addEventListener("input", refresh);
$("detachBtn").onclick = () => {
  detach(); active = null;
  $("termbar").style.display = "none"; $("term").style.display = "none";
  $("promptbar").style.display = "none"; $("empty").style.display = "flex";
  refresh();
};
$("killBtn").onclick = async () => {
  if (!active) return;
  if (!confirm("Kill session " + active.session.name + "?")) return;
  await api(active.host, "/api/sessions/" + active.session.id, { method: "DELETE" });
  $("detachBtn").click();
};
$("sendBtn").onclick = sendPrompt;
$("promptInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendPrompt(); });
async function sendPrompt() {
  if (!active) return;
  const v = $("promptInput").value;
  if (!v) return;
  await api(active.host, "/api/sessions/" + active.session.id + "/input", { method: "POST", body: v });
  $("promptInput").value = "";
}

$("menuBtn").onclick = () => $("fleet").classList.toggle("open");

// New session dialog
$("newBtn").onclick = async () => {
  const hostSel = $("newHost"); hostSel.innerHTML = "";
  hosts.forEach((h, i) => { const o = document.createElement("option"); o.value = i; o.textContent = h.label; hostSel.appendChild(o); });
  await populateProfiles();
  hostSel.onchange = populateProfiles;
  newDlg.showModal();
};
async function populateProfiles() {
  const host = hosts[$("newHost").value || 0];
  const sel = $("newProfile"); sel.innerHTML = "";
  try {
    const profs = await api(host, "/api/profiles");
    profs.forEach(p => { const o = document.createElement("option"); o.value = p.name;
      o.textContent = p.name + (p.description ? " — " + p.description : ""); sel.appendChild(o); });
  } catch { const o = document.createElement("option"); o.textContent = "(host unreachable)"; sel.appendChild(o); }
}
$("createBtn").onclick = async () => {
  const host = hosts[$("newHost").value || 0];
  const profile = $("newProfile").value;
  const name = $("newName").value || undefined;
  const tags = ($("newTags").value || "").split(",").map(t => t.trim()).filter(Boolean);
  try {
    const s = await api(host, "/api/sessions", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile, name, tags }) });
    newDlg.close(); $("newName").value = ""; $("newTags").value = "";
    await refresh();
    attach(host, s);
  } catch (e) { alert("Create failed: " + e.message); }
};

// Hosts dialog
$("hostsBtn").onclick = () => { renderHostList(); hostsDlg.showModal(); };
function renderHostList() {
  const el = $("hostList"); el.innerHTML = "";
  hosts.forEach((h, i) => {
    const row = document.createElement("div"); row.className = "sess";
    row.innerHTML = `<span class="nm">${escapeHtml(h.label)} <small>${escapeHtml(h.url)}</small></span>`;
    const test = document.createElement("button"); test.textContent = "🔔"; test.title = "Send a test notification from this host";
    test.onclick = async () => {
      try { await api(h, "/api/notify-test", { method: "POST" }); alert("Test push sent from " + h.label); }
      catch (e) { alert("Notify test failed (" + h.label + "): " + e.message); }
    };
    const del = document.createElement("button"); del.textContent = "✕";
    del.onclick = () => { hosts.splice(i, 1); saveHosts(hosts); renderHostList(); refresh(); };
    row.appendChild(test); row.appendChild(del); el.appendChild(row);
  });
}
$("addHostBtn").onclick = () => {
  const label = $("hLabel").value.trim(), url = $("hUrl").value.trim().replace(/\/$/, ""), token = $("hToken").value.trim();
  if (!label || !url) return alert("Label and URL required");
  hosts.push({ label, url, token }); saveHosts(hosts);
  $("hLabel").value = $("hUrl").value = $("hToken").value = "";
  renderHostList(); refresh();
};

refresh();
setInterval(() => { if (!active) refresh(); }, 5000); // auto-refresh fleet when not attached
</script>
</body>
</html>
