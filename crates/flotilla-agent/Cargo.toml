[package]
name = "flotilla-agent"
description = "Per-host daemon that owns AI-agent PTY sessions and exposes them over HTTP/WebSocket on the tailnet."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "flotilla-agent"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
bytes.workspace = true
clap.workspace = true

axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
hostname = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json"] }

# Web push (Phase 3): pure-Rust crypto (ece/p256), hyper client — no openssl,
# so it builds cleanly on the Windows fleet too.
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
p256 = { version = "0.13", features = ["arithmetic"] }
rand = "0.8"
base64 = "0.22"

# Cloudflare Access JWT validation (Phase 4).
jsonwebtoken = "9"
