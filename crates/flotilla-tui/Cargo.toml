[package]
name = "flotilla-tui"
description = "Terminal control plane for the Flotilla agent fleet — list, attach, spawn and kill sessions across every host on the tailnet."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "flotilla"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures-util.workspace = true
bytes.workspace = true
clap.workspace = true

ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
toml = "0.8"
