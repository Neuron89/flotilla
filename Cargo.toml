[workspace]
resolver = "2"
members = [
    "crates/flotilla-agent",
    "crates/flotilla-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hayden Nester <hsnester@gmail.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
