# Host list for the `flotilla` TUI.  Use with:  flotilla --config flotilla-hosts.toml
# (or set FLOTILLA_HOSTS=/path/to/this/file)
#
# URLs use Tailscale MagicDNS names so they work identically from any machine
# or your phone, anywhere. Find names with `tailscale status`.

[[hosts]]
label = "home-server"
url = "http://home-server:7878"
token = ""

[[hosts]]
label = "work-server"
url = "http://work-server:7878"
token = ""

[[hosts]]
label = "laptop-cachy"
url = "http://laptop-cachy:7878"
token = ""

[[hosts]]
label = "desktop"
url = "http://desktop:7878"
token = ""

# ---- Templates (Phase 3) ---------------------------------------------------
# A template spawns a named set of sessions across hosts in one action. In the
# TUI press `t` to pick one and launch it; the web client has a Templates dialog.
# Each item targets a host by its `label` above.

[[templates]]
name = "ai-fleet"
[[templates.items]]
host = "home-server"
profile = "claude"
tags = ["fleet"]
[[templates.items]]
host = "work-server"
profile = "hermes"
tags = ["fleet"]

[[templates]]
name = "dev-laptop"
[[templates.items]]
host = "laptop-cachy"
profile = "claude"
name = "scratch"
