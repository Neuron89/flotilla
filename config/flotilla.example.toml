# flotilla-agent configuration — copy to flotilla.toml and edit per host.
# Loaded with:  flotilla-agent --config /path/to/flotilla.toml
#
# ⚠️  THIS FILE CONTAINS SECRETS (bearer token, ntfy token). Keep the copy at
# /etc/flotilla/flotilla.toml (or %LOCALAPPDATA%\Flotilla\flotilla.toml)
# readable only by the account that runs the daemon — the install scripts
# chmod it 600 / restrict its ACL for you.

# Recommended default is loopback-only (127.0.0.1). Binding 0.0.0.0 — even on
# a trusted tailnet — should be an explicit, deliberate opt-in: it's what
# actually puts the daemon on the wire for every other tailnet member (and
# anyone who lands on that network) to reach.
bind = "0.0.0.0:7878"

# Shared bearer token — required for any non-loopback bind. Every client must
# send this as `Authorization: Bearer …` or `?token=`. If this is left empty,
# the daemon fails closed: it will refuse to bind anywhere but 127.0.0.1
# rather than serve an unauthenticated endpoint to the tailnet. The install
# scripts generate a random token for you if you leave this placeholder in
# place; to set your own, use something like:
#   openssl rand -hex 24
# (To deliberately run token-less on a NON-loopback bind, you must pass the
#  explicit `--insecure-no-auth` flag — the daemon will not do it silently.)
token = "REPLACE_ME_generate_with_openssl_rand_hex_24"

# Friendly name shown in the fleet UIs. Defaults to the machine hostname.
host_label = "home-server"

# Cross-origin allowlist for the browser/PWA client. The web client served by
# THIS host is same-origin and needs nothing here. Only add entries if you open
# ONE web page that aggregates several hosts (the fleet grid fetching peer
# hosts' APIs cross-origin) — list each peer's full origin, scheme included.
# Empty (the default) means: same-origin only. It also gates the WebSocket
# Origin check, so a stray/ malicious website can't hijack an attach socket.
# allowed_origins = ["http://home-server:7878", "http://work-server:7878"]
allowed_origins = []

# Where session metadata snapshots are written (best-effort, for observability).
# data_dir = "/var/lib/flotilla"

# ---- Session launch profiles ----------------------------------------------
# Each profile is one kind of agent you can spawn. The shared Obsidian
# knowledge base is reached through Claude's *user-scope* MCP config, so a
# plain `claude` profile already inherits it. Point `cwd` at the agent
# workspace that holds your CLAUDE.md / .mcp.json if you keep one.

[[profiles]]
name = "claude"
command = "claude"
args = []
# cwd = "/home/hnester/agent-workspace"   # holds CLAUDE.md + Obsidian MCP context
description = "Claude Code (inherits user-scope MCP incl. Obsidian KB)"

[[profiles]]
name = "hermes"
command = "hermes"
args = []
description = "Hermes agent"

[[profiles]]
name = "shell"
command = "bash"
args = ["-l"]
description = "Login shell"

# Example: a Claude session pinned to a specific repo with an injected env var.
# [[profiles]]
# name = "portal"
# command = "claude"
# cwd = "/home/hnester/portal"
# [profiles.env]
# FLOTILLA_SESSION = "portal"

# ---- Phone push notifications (Phase 2, via ntfy) -------------------------
# When a session transitions into a watched state (e.g. it starts WAITING on
# your input), this host POSTs to your ntfy topic so your phone buzzes — even
# when you've walked away. Self-host ntfy on the tailnet, or use ntfy.sh with
# an unguessable topic. Install the ntfy app and subscribe to the same topic.
#
# NOTE: on public ntfy.sh, the topic name IS the only secret — anyone who
# guesses/knows it can read your notifications (session names, tags, host
# labels) and publish to it. Use a long random topic, not something guessable
# like "flotilla-alerts". Prefer self-hosting ntfy on your own tailnet, where
# the tailnet ACL is the access boundary instead of topic secrecy.
[notifications]
enabled = false                       # flip to true once topic is set
ntfy_url = "https://ntfy.sh"          # or http://ntfy.your-tailnet:80
topic = "flotilla-CHANGE-ME-9f3k2"    # pick something long + unguessable, not this
token = ""                            # optional ntfy access token (Bearer)
priority = "high"                     # min | low | default | high | urgent
notify_on = ["waiting"]               # add "exited" to alert on process exit
public_url = ""                       # this host's tailnet URL, e.g. http://home-server:7878
                                      # (enables tap-to-open deep links in the push)
poll_ms = 1500                        # how often to check for state transitions
