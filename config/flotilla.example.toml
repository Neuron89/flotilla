# flotilla-agent configuration — copy to flotilla.toml and edit per host.
# Loaded with:  flotilla-agent --config /path/to/flotilla.toml

# Bind to the tailnet. 0.0.0.0 is fine because Tailscale is the access boundary;
# nothing here is exposed to the public internet unless you forward it.
bind = "0.0.0.0:7878"

# Optional shared bearer token (defense-in-depth on top of the tailnet ACL).
# Leave empty to disable. If set, every client must present it.
token = ""

# Friendly name shown in the fleet UIs. Defaults to the machine hostname.
host_label = "home-server"

# Where session metadata snapshots are written (best-effort, for observability).
# data_dir = "/var/lib/flotilla"

# ---- Session launch profiles ----------------------------------------------
# Each profile is one kind of agent you can spawn. The shared Obsidian
# knowledge base is reached through Claude's *user-scope* MCP config, so a
# plain `claude` profile already inherits it. Point `cwd` at the agent
# workspace that holds your CLAUDE.md / .mcp.json if you keep one.
#
# backend (Phase 3): "pty" (default) or "tmux".
#   pty  — the daemon owns the PTY directly. Simple, cross-platform, but the
#          session ends if flotilla-agent restarts.
#   tmux — the command runs in a detached tmux session and the daemon only
#          owns a `tmux attach` PTY. The session SURVIVES a daemon restart:
#          on boot the agent re-adopts every flotilla_* tmux session and
#          recovers its scrollback. Linux/macOS only (requires tmux on PATH);
#          falls back to pty on Windows automatically.

[[profiles]]
name = "claude"
command = "claude"
args = []
# cwd = "/home/hnester/agent-workspace"   # holds CLAUDE.md + Obsidian MCP context
backend = "tmux"                          # restart-proof; needs tmux installed
description = "Claude Code (inherits user-scope MCP incl. Obsidian KB)"

[[profiles]]
name = "hermes"
command = "hermes"
args = []
backend = "tmux"
description = "Hermes agent"

[[profiles]]
name = "shell"
command = "bash"
args = ["-l"]
# backend = "pty"                         # default; uncomment to be explicit
description = "Login shell"

# Example: a Claude session pinned to a specific repo with an injected env var.
# [[profiles]]
# name = "portal"
# command = "claude"
# cwd = "/home/hnester/portal"
# [profiles.env]
# FLOTILLA_SESSION = "portal"

# ---- Phone push notifications (Phase 2, via ntfy) -------------------------
# When a session transitions into a watched state (e.g. it starts WAITING on
# your input), this host POSTs to your ntfy topic so your phone buzzes — even
# when you've walked away. Self-host ntfy on the tailnet, or use ntfy.sh with
# an unguessable topic. Install the ntfy app and subscribe to the same topic.
[notifications]
enabled = false                       # flip to true once topic is set
ntfy_url = "https://ntfy.sh"          # or http://ntfy.your-tailnet:80
topic = "flotilla-CHANGE-ME-9f3k2"    # pick something unguessable
token = ""                            # optional ntfy access token (Bearer)
priority = "high"                     # min | low | default | high | urgent
notify_on = ["waiting"]               # add "exited" to alert on process exit
public_url = ""                       # this host's tailnet URL, e.g. http://home-server:7878
                                      # (enables tap-to-open deep links in the push)
poll_ms = 1500                        # how often to check for state transitions

# ---- Web push into the installed PWA (Phase 3) ----------------------------
# Native browser/PWA notifications via VAPID Web Push, fired on the same
# transitions as ntfy (reuses notify_on / poll_ms / public_url above). No ntfy
# app needed. NOTE: the browser Push API requires a secure context, so this only
# works when the web client is served over HTTPS (a Cloudflare tunnel or
# `tailscale serve`) — not over a plain-http tailnet URL.
#
# Generate keys once with:  flotilla-agent --gen-vapid
# Use the SAME keypair on EVERY host so one browser subscription can be woken by
# any box (the PWA registers its subscription with all configured hosts).
[web_push]
enabled = false
private_key = ""                      # from --gen-vapid (URL-safe base64, no pad)
public_key = ""                       # from --gen-vapid
subject = "mailto:you@example.com"    # VAPID contact (mailto: or origin URL)

# ---- Cloudflare Access auth (Phase 4) -------------------------------------
# Front this agent with a Cloudflare Tunnel + an Access application and the
# edge handles login (OAuth/OTP). This block validates the JWT Cloudflare
# injects, so only users who passed the Access policy reach the daemon — with
# per-user identity (shown in the UI / at /api/me). See
# deploy/cloudflare-access-setup.md for the 10-minute setup.
#
# A request is admitted by EITHER a valid Access JWT (public tunnel / browser)
# OR the bearer `token` above (TUI over the tailnet) — so both keep working.
[access]
enabled = false
team_domain = "https://YOURTEAM.cloudflareaccess.com"   # your Zero Trust team domain
aud = ""                              # Application Audience (AUD) tag from the Access app
allowed_emails = []                   # optional extra allowlist, e.g. ["you@example.com"]
                                      # empty = trust whoever the Access policy admits
